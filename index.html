<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Strood is a local live-coding studio for writing and performing Strudel songs.">
  <title>Strood</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230d1117' stroke='%23e6b450' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%2356d4dd' stroke-width='2'/%3E%3Ccircle cx='24' cy='7' r='3' fill='%23f07178'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="transport" aria-label="Song transport">
    <h1 class="brand" aria-label="Strood live coding studio">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">strood</span>
    </h1>

    <div class="song-identity">
      <span class="eyebrow">song</span>
      <button id="song-name" class="song-name-button" type="button" title="Open songs">Untitled</button>
      <span id="save-state" class="save-state" role="status" aria-live="polite" hidden></span>
    </div>

    <div class="view-switch" role="group" aria-label="Workspace view">
      <button id="code-view-btn" type="button" aria-pressed="true">Code</button>
      <button id="graph-view-btn" type="button" aria-pressed="false">Graph</button>
    </div>

    <div class="transport-actions">
      <span class="update-slot">
        <button id="update-btn" class="control control-update" type="button" title="Update playing song (Ctrl+Enter)" hidden>Update</button>
      </span>
      <button id="run-btn" class="control control-primary transport-button" type="button" aria-label="Play" title="Play (Ctrl+Enter)">
        <svg class="transport-icon transport-icon-play" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
        <svg class="transport-icon transport-icon-pause" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" hidden><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
      <button id="stop-btn" class="control transport-button transport-stop" type="button" aria-label="Stop" title="Stop (Ctrl+.)" disabled>
        <svg class="transport-icon" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
      </button>
      <span class="transport-divider" aria-hidden="true"></span>
      <button id="save-btn" class="control" type="button" title="Save song (Ctrl+S)">Save</button>
      <button id="open-btn" class="control" type="button" title="Open songs (Ctrl+O)">Open</button>
      <button id="new-btn" class="control" type="button" title="New song (Ctrl+N)">New</button>
      <button id="patch-btn" class="control control-patch" type="button" title="Open patch studio (Ctrl+P)">Patch</button>
    </div>

  </header>

  <div id="workspace">
    <main id="main">
      <div id="editors-container">
        <div id="editor" class="editor-panel" aria-label="Song code editor"></div>
      </div>
      <section id="graph-view" aria-label="Song graph" hidden>
        <div class="graph-performance" aria-label="Graph playback controls">
          <div class="graph-section-readout" aria-live="polite">
            <span>section</span>
            <strong class="graph-section-name">No arrangement</strong>
            <small class="graph-section-cycle"></small>
          </div>
          <div class="graph-section-strip" role="group" aria-label="Song sections"></div>
          <button class="graph-visualizers-toggle" type="button" role="switch" aria-checked="true" title="Turn visualisers off">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M1.5 8h2l1.25-3.2L7 11.2 9.15 6l1.15 2H14.5" />
            </svg>
            <span>Visuals</span>
            <i aria-hidden="true"></i>
          </button>
        </div>
        <div class="graph-viewport" tabindex="0" aria-label="Moveable song graph canvas">
          <div class="graph-stage">
            <div class="graph-surface">
              <svg class="graph-edges" aria-hidden="true" preserveAspectRatio="none"></svg>
              <div class="graph-nodes"></div>
              <p class="graph-empty" hidden>Add a named pattern and a track to generate its graph.</p>
            </div>
          </div>
        </div>
      </section>
      <canvas id="viz" aria-hidden="true"></canvas>
    </main>
  </div>

  <section id="diagnostics" class="diagnostics" aria-live="assertive" hidden>
    <div class="diagnostic-indicator" aria-hidden="true"></div>
    <div class="diagnostic-copy">
      <strong id="diagnostic-title">Couldn’t run this version</strong>
      <span id="diagnostic-message"></span>
    </div>
    <button id="diagnostic-close" class="icon-button" type="button" aria-label="Dismiss error">×</button>
  </section>

  <footer id="statusline">
    <span id="mode" class="stopped" role="status">STOPPED</span>
    <span id="dirty-count"></span>
    <span id="queue-status" class="queue-status" role="status" aria-live="polite"></span>
    <div class="master" aria-label="Output safety meter">
      <span class="eyebrow">output</span>
      <div class="master-meter" aria-hidden="true"><span id="master-level"></span><i id="master-peak"></i></div>
      <span id="limiter-state" class="limiter-state"></span>
    </div>
    <details class="shortcut-menu">
      <summary>Shortcuts</summary>
      <div class="shortcut-popover">
        <span><kbd>Ctrl</kbd><kbd>Enter</kbd> Play / update</span>
        <span><kbd>Ctrl</kbd><kbd>U</kbd> Update now</span>
        <span><kbd>Ctrl</kbd><kbd>.</kbd> Stop</span>
        <span><kbd>Ctrl</kbd><kbd>S</kbd> Save</span>
        <span><kbd>Ctrl</kbd><kbd>O</kbd> Open</span>
        <span><kbd>Ctrl</kbd><kbd>P</kbd> Patch</span>
        <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>F</kbd> Performance</span>
        <span><kbd>Ctrl</kbd><kbd>1–3</kbd> Columns</span>
      </div>
    </details>
  </footer>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
