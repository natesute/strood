<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Strood is a local live-coding studio for writing and performing Strudel songs.">
  <title>Strood</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230d1117' stroke='%23e6b450' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%2356d4dd' stroke-width='2'/%3E%3Ccircle cx='24' cy='7' r='3' fill='%23f07178'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="patch-editor.css">
</head>
<body>
  <header id="transport" aria-label="Song transport">
    <h1 class="brand" aria-label="Strood live coding studio">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">strood</span>
    </h1>

    <button id="tracks-btn" class="control control-tracks" type="button" aria-pressed="true" title="Show or hide tracks">
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Tracks</span>
    </button>

    <div class="song-identity">
      <span class="eyebrow">song</span>
      <button id="song-name" class="song-name-button" type="button" title="Open songs">Untitled</button>
      <span id="save-state" class="save-state" role="status" aria-live="polite">Ready</span>
    </div>

    <div class="transport-actions">
      <button id="run-btn" class="control control-primary" type="button" title="Run or update (Ctrl+Enter)">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
        <span>Run</span>
      </button>
      <button id="stop-btn" class="control" type="button" title="Stop (Ctrl+.)">
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
        <span>Stop</span>
      </button>
      <span class="transport-divider" aria-hidden="true"></span>
      <button id="save-btn" class="control" type="button" title="Save song (Ctrl+S)">Save</button>
      <button id="open-btn" class="control" type="button" title="Open songs (Ctrl+O)">Open</button>
      <button id="new-btn" class="control" type="button" title="New song (Ctrl+N)">New</button>
      <button id="patch-btn" class="control control-patch" type="button" title="Open patch studio (Ctrl+P)">Patch</button>
    </div>

  </header>

  <div id="workspace">
    <div id="track-region" role="complementary" aria-label="Song tracks">
      <div id="track-rail">
        <div class="rail-header">
          <span class="eyebrow">tracks</span>
          <span id="track-count">0</span>
          <button id="collapse-tracks-btn" class="rail-collapse" type="button" aria-label="Collapse track rail">‹</button>
        </div>
        <div id="track-list"></div>
        <p id="track-empty" class="rail-empty">Name sections with comments such as <code>// BASS</code>.</p>
      </div>
      <div id="rail-resizer" role="separator" aria-label="Resize track rail" aria-orientation="vertical" tabindex="0"></div>
    </div>

    <main id="main">
      <div id="editors-container">
        <div id="editor" class="editor-panel" aria-label="Song code editor"></div>
      </div>
      <canvas id="viz" aria-hidden="true"></canvas>
    </main>
  </div>

  <section id="diagnostics" class="diagnostics" aria-live="assertive" hidden>
    <div class="diagnostic-indicator" aria-hidden="true"></div>
    <div class="diagnostic-copy">
      <strong id="diagnostic-title">Couldn’t run this version</strong>
      <span id="diagnostic-message"></span>
    </div>
    <button id="diagnostic-close" class="icon-button" type="button" aria-label="Dismiss error">×</button>
  </section>

  <footer id="statusline">
    <span id="mode" class="stopped" role="status">STOPPED</span>
    <span class="sep" aria-hidden="true">|</span>
    <span id="info">1:1</span>
    <span class="sep" aria-hidden="true">|</span>
    <span id="dirty-count"></span>
    <span id="cycle-status" class="cycle-status">cycle 1</span>
    <span id="section-status" class="section-status">free play</span>
    <span id="queue-status" class="queue-status" role="status" aria-live="polite"></span>
    <span id="boot-status" class="boot-status" role="status" aria-live="polite">Audio loads when you run</span>
    <label class="viz-mode-label">
      <span>visuals</span>
      <select id="visualizer-mode" aria-label="Visualiser placement">
        <option value="inline">inline</option>
        <option value="dock">dock</option>
        <option value="hidden">off</option>
      </select>
    </label>
    <div class="master" aria-label="Master output">
      <span class="eyebrow">master</span>
      <input id="master-volume" type="range" min="0" max="1.2" step="0.01" value="0.82" aria-label="Master volume">
      <div class="master-meter" aria-hidden="true"><span id="master-level"></span><i id="master-peak"></i></div>
      <span id="limiter-state" class="limiter-state">safe</span>
    </div>
    <details class="shortcut-menu">
      <summary>Shortcuts</summary>
      <div class="shortcut-popover">
        <span><kbd>Ctrl</kbd><kbd>Enter</kbd> Run</span>
        <span><kbd>Ctrl</kbd><kbd>U</kbd> Update now</span>
        <span><kbd>Ctrl</kbd><kbd>.</kbd> Stop</span>
        <span><kbd>Ctrl</kbd><kbd>S</kbd> Save</span>
        <span><kbd>Ctrl</kbd><kbd>O</kbd> Open</span>
        <span><kbd>Ctrl</kbd><kbd>P</kbd> Patch</span>
        <span><kbd>Ctrl</kbd><kbd>1–3</kbd> Columns</span>
      </div>
    </details>
  </footer>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
